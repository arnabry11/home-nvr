services:
  tailscale:
    image: tailscale/tailscale:v1.104.1
    container_name: nvr-tailscale
    hostname: ${TS_HOSTNAME:-nvr}
    restart: always
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-} # only needed on first start
      TS_HOSTNAME: ${TS_HOSTNAME:-nvr}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro

  go2rtc:
    image: alexxit/go2rtc:1.9.14
    container_name: nvr-go2rtc
    restart: always
    environment:
      CAMERA_USER: ${CAMERA_USER}
      CAMERA_PASSWORD: ${CAMERA_PASSWORD}
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro

  mediamtx:
    image: bluenviron/mediamtx:1.21.2
    container_name: nvr-mediamtx
    restart: always
    depends_on:
      - go2rtc
    environment:
      MTX_PATHDEFAULTS_RECORDDELETEAFTER: ${RECORD_RETENTION:-6d}
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ${RECORDINGS_DIR:-./recordings}:/recordings

  watchdog:
    image: python:3.13-alpine
    container_name: nvr-watchdog
    restart: always
    depends_on:
      - go2rtc
      - mediamtx
    command: ["python", "-u", "/watchdog.py"]
    volumes:
      - ./watchdog/watchdog.py:/watchdog.py:ro

  live:
    build:
      context: ./live
    container_name: nvr-live
    restart: always
    # The owner of RECORDINGS_DIR, which need not be readable by anyone else.
    user: ${RECORDINGS_OWNER:-1000:1000}
    depends_on:
      - mediamtx
    volumes:
      # Read-only: the live view only ever reads what MediaMTX recorded.
      - ${RECORDINGS_DIR:-./recordings}:/recordings:ro

  web:
    build:
      context: ./web
    container_name: nvr-web
    restart: always
    depends_on:
      - go2rtc
      - mediamtx
      - live

volumes:
  tailscale-state:
# No "ports:" anywhere - the UI is reachable only through the Tailscale sidecar.
