services:
  tailscale:
    image: tailscale/tailscale:v1.104.1
    container_name: nvr-tailscale
    hostname: ${TS_HOSTNAME:-nvr}
    restart: always
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-} # only needed on first start
      TS_HOSTNAME: ${TS_HOSTNAME:-nvr}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro

  go2rtc:
    image: alexxit/go2rtc:1.9.14
    container_name: nvr-go2rtc
    restart: always
    environment:
      CAMERA_USER: ${CAMERA_USER}
      CAMERA_PASSWORD: ${CAMERA_PASSWORD}
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro

  mediamtx:
    image: bluenviron/mediamtx:1.21.2
    container_name: nvr-mediamtx
    restart: always
    depends_on:
      - go2rtc
    environment:
      MTX_PATHDEFAULTS_RECORDDELETEAFTER: ${RECORD_RETENTION:-7d}
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ${RECORDINGS_DIR:-./recordings}:/recordings

  web:
    build:
      context: ./web
    container_name: nvr-web
    restart: always
    depends_on:
      - go2rtc
      - mediamtx

volumes:
  tailscale-state:
# No "ports:" anywhere - the UI is reachable only through the Tailscale sidecar.
